name: CI

# Пуши в main и теги проверяет release.yml (вызывает этот workflow перед публикацией образа),
# поэтому здесь нет push: main — иначе CI на main шёл бы дважды.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.15"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Тесты не ходят в сеть: Keitaro подменён httpx.MockTransport, БД — SQLite в памяти.
      - run: pytest -q --junitxml=pytest-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: pytest-report.xml

  migrations:
    name: Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keitaro
          POSTGRES_PASSWORD: keitaro
          POSTGRES_DB: keitaro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keitaro"
          --health-interval 2s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://keitaro:keitaro@localhost:5432/keitaro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: upgrade → downgrade → upgrade
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: models match migrations
        run: alembic check

  docker:
    name: Docker image + compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: prepare .env (без настоящего ключа — смоук не ходит в Keitaro)
        run: cp .env.example .env
      - name: build and start (ждём healthcheck приложения и БД)
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: smoke
        run: |
          curl -fsS http://localhost:8000/healthz | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS -o /dev/null http://localhost:8000/
          curl -fsS -o /dev/null http://localhost:8000/static/app.js
          docker compose exec -T app alembic current | grep -q "(head)"
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: stop
        if: always()
        run: docker compose down -v
