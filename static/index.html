<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keitaro wrapper</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1c2330; --muted:#6b7686; --line:#e1e5eb; --acc:#2b6cff; --bad:#d6334a; --ok:#1a8f4d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181f; --card:#1d232d; --fg:#e8ecf2; --muted:#93a0b3; --line:#2c3441; --acc:#6c9bff; --bad:#ff6b80; --ok:#4cc783; } }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui,sans-serif }
  main { max-width:860px; margin:0 auto; padding:16px }
  nav { display:flex; gap:8px; margin-bottom:16px } nav button { flex:1 }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px }
  input,select,button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); width:100% }
  button { cursor:pointer; width:auto } button.primary { background:var(--acc); color:#fff; border-color:var(--acc) }
  nav button.on { background:var(--acc); color:#fff; border-color:var(--acc) }
  button.danger { color:var(--bad) } button:disabled { opacity:.5; cursor:default }
  table { width:100%; border-collapse:collapse } td,th { text-align:left; padding:8px 4px; border-bottom:1px solid var(--line) }
  .msg { padding:10px; border-radius:8px; margin-top:12px } .msg.err { color:var(--bad); border:1px solid var(--bad) } .msg.ok { color:var(--ok); border:1px solid var(--ok) }
  .row { display:flex; gap:8px } .row > :first-child { flex:1 } .muted { color:var(--muted); font-size:13px }
  .pager { display:flex; gap:8px; align-items:center; margin-top:10px } .pager span { flex:1; text-align:center }
  tr.pick { cursor:pointer } tr.pick:hover td, tr.pick.on td { background:color-mix(in srgb, var(--acc) 10%, transparent) }
  .links a { color:var(--acc); word-break:break-all } .warn { color:var(--bad) } code { font-size:13px }
  .user { display:flex; gap:6px; align-items:center; margin-bottom:12px } .user input { max-width:260px }
  .combo { position:relative }
  .combo > input { padding-right:56px }
  .combo-caret { position:absolute; right:12px; top:50%; width:8px; height:8px; margin-top:-6px; border:solid var(--muted);
    border-width:0 1.5px 1.5px 0; transform:rotate(45deg); pointer-events:none; transition:transform .15s }
  .combo.open .combo-caret { transform:rotate(-135deg); margin-top:-2px }
  .combo-clear { position:absolute; right:28px; top:50%; transform:translateY(-50%); border:0; background:none; padding:2px 6px;
    color:var(--muted); font-size:18px; line-height:1 }
  .combo-clear:hover { color:var(--fg) }
  .combo-list { position:absolute; z-index:10; left:0; right:0; top:calc(100% + 4px); margin:0; padding:4px; list-style:none;
    max-height:320px; overflow:auto; background:var(--card); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 10px 28px rgba(0,0,0,.14) }
  .combo-opt { display:grid; grid-template-columns:auto 1fr auto; gap:2px 10px; align-items:center; padding:8px 10px;
    border-radius:8px; cursor:pointer }
  .combo-opt.active { background:color-mix(in srgb, var(--acc) 12%, transparent) }
  .combo-opt[aria-selected="true"] .combo-title::after { content:" ✓"; color:var(--acc) }
  .combo-id { grid-row:span 2; font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--muted);
    background:color-mix(in srgb, var(--fg) 6%, transparent); padding:5px 6px; border-radius:6px }
  .combo-title { font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .combo-net { font-size:12px; color:var(--muted); white-space:nowrap }
  .combo-meta { grid-column:2 / 4; display:flex; flex-wrap:wrap; gap:4px; font-size:12px; color:var(--muted) }
  .chip { padding:1px 7px; border-radius:999px; border:1px solid var(--line); white-space:nowrap }
  .chip.geo { border-color:color-mix(in srgb, var(--acc) 40%, var(--line)); color:var(--acc) }
  .combo-empty, .combo-more { padding:10px; color:var(--muted); font-size:13px; text-align:center }
  :root { --mark:#ffe58a } @media (prefers-color-scheme: dark) { :root { --mark:#6b5a12 } }
  .combo mark { background:var(--mark); color:var(--fg); border-radius:3px; padding:0 1px }
  input:focus, select:focus { outline:none; border-color:var(--acc); box-shadow:0 0 0 3px color-mix(in srgb, var(--acc) 22%, transparent) }
  .total.bad { color:var(--bad) } .total.ok { color:var(--ok) } h2 { margin:0 0 8px; font-size:17px } .hide { display:none }
</style>
</head>
<body>
<main>
  <div class="user"><span class="muted">Вы:</span><input id="actor" placeholder="email или имя (для аудита)" maxlength="255"></div>
  <nav>
    <button id="tab-create" class="on">Создать кампанию</button>
    <button id="tab-edit">Редактор кампании</button>
  </nav>

  <section id="view-create" class="card">
    <h2>Новая кампания</h2>
    <form id="create-form">
      <label>Название <span class="muted" id="prefix"></span></label>
      <input id="c-name" required maxlength="200" placeholder="campaign1">
      <label>Гео — коды стран ISO через запятую или пробел</label>
      <input id="c-country" required maxlength="120" placeholder="US, DE, FR" style="text-transform:uppercase">
      <label>Оффер</label>
      <div class="combo" id="c-offer-combo">
        <input id="c-offer-q" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="c-offer-list"
               placeholder="Найдите оффер по id или названию" autocomplete="off" spellcheck="false">
        <button type="button" class="combo-clear hide" id="c-offer-clear" aria-label="Сбросить оффер">×</button>
        <span class="combo-caret" aria-hidden="true"></span>
        <input type="hidden" id="c-offer">
        <ul class="combo-list hide" id="c-offer-list" role="listbox" aria-label="Офферы"></ul>
      </div>
      <div class="muted" id="c-offer-count"></div>
      <div style="margin-top:14px"><button class="primary" id="c-submit">Создать</button></div>
    </form>
    <div id="c-msg"></div>
  </section>

  <section id="view-edit" class="hide">
    <div class="card">
      <h2>Кампании</h2>
      <input id="e-search" type="search" placeholder="Поиск по id или имени">
      <table id="e-list"></table>
      <div class="pager"><button id="e-prev">← Назад</button><span id="e-page" class="muted"></span><button id="e-next">Вперёд →</button></div>
    </div>
    <div id="e-streams"></div>
    <div id="e-msg"></div>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
