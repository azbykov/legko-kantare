services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: keitaro
      POSTGRES_PASSWORD: keitaro
      POSTGRES_DB: keitaro
    # порт наружу не публикуется: БД доступна только приложению внутри сети compose
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keitaro"]
      interval: 2s
      retries: 15
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://keitaro:keitaro@db:5432/keitaro
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    # healthcheck приложения — в Dockerfile (/healthz проверяет БД)
volumes:
  pgdata:
